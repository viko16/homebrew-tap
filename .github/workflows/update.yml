name: Update casks

on:
  schedule:
    - cron: '0 23 * * *' # 07:00 Asia/Singapore
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-casks

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_casks.py
      - name: Publish changes
        run: |
          if git diff --quiet -- Casks; then
            echo "Casks are up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Casks
          git commit -m 'chore: update casks to latest releases'
          git push
